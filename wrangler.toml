name = "games-rooms"
main = "worker/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the free plan; the older
# key-value ones are not.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
ALLOWED_ORIGINS = "https://games.abbondanzo.com,https://games-ccu.pages.dev,http://localhost:5173,http://localhost:4173"

# Cloudflare's rate limiter. Joining is the one endpoint worth guarding: it is
# where a guessed code would be tried.
[[unsafe.bindings]]
name = "JOIN_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
