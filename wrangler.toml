name = "games-rooms"
main = "worker/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the free plan; the older
# key-value ones are not.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Tells the Worker which upload is running, for /health.
[version_metadata]
binding = "VERSION"

[vars]
# There is one room server, so this list has to admit everything that talks to
# it: the live site, every Pages preview, and a dev server. Each Pages
# deployment gets its own subdomain, hence the wildcard - one label under this
# project only, since *.pages.dev would admit every site on the platform.
ALLOWED_ORIGINS = "https://games.abbondanzo.com,https://games-ccu.pages.dev,https://*.games-ccu.pages.dev,http://localhost:5173,http://localhost:4173"

DICTIONARY_REFERENCE = "sd3"

# Cloudflare's rate limiter. Joining is the one endpoint worth guarding: it is
# where a guessed code would be tried.
[[unsafe.bindings]]
name = "JOIN_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Definitions are cheap to ask for and metered upstream - the free tier is 1000
# lookups a day for the whole account - so this one guards the budget rather
# than the room. Its own namespace, so a busy Scrabble game cannot use up what
# joining needs.
[[unsafe.bindings]]
name = "DEFINE_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# DICTIONARY_KEY is a secret, not a var: set it with
#   wrangler secret put DICTIONARY_KEY
# and locally with a .dev.vars file, which is gitignored. GET /health reports
# whether it is bound.
#
# Which dictionary that key is for, though, is not a secret and is not a
# property of the code either - Merriam-Webster issues a key per reference and
# every other one refuses it. `sd3` is the Intermediate Dictionary; `sd2`
# Elementary, `sd4` School, `collegiate` Collegiate, `learners` Learner's.
# Changing the key to one for another reference means changing this too.
