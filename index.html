<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Games</title>
    <meta
      name="description"
      content="Score trackers for Scrabble, cricket darts, Rummikub and Yahtzee. Works offline."
    />

    <!-- The Cloudflare Pages subdomain serves the same build, so point search
         engines at the one canonical host. -->
    <link rel="canonical" href="https://games.abbondanzo.com/" />

    <!-- Tab icon. SVG where supported, PNG for everything else. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- Installed app. iOS reads apple-touch-icon rather than the manifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tints the status bar area when launched from the home screen. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10131a" />

    <!-- The colour scheme they chose, ahead of the first paint, or the page
         flashes dark before turning light. Read the same way in
         src/shared/theme.ts, which owns this key. -->
    <script>
      (function () {
        try {
          var chosen = JSON.parse(localStorage.getItem('games.theme.v1'));
          if (chosen === 'light' || chosen === 'dark') {
            document.documentElement.dataset.theme = chosen;
            var tint = document.createElement('meta');
            tint.setAttribute('name', 'theme-color');
            tint.setAttribute('data-chosen', '');
            tint.setAttribute('content', chosen === 'light' ? '#f4f6fa' : '#10131a');
            document.head.prepend(tint);
          }
        } catch (e) {
          // Nothing stored, or no storage at all: the device preference stands.
        }
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Games" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Recovering from a stale page. -->
    <script>
      (function () {
        var TRIED = 'games.reload.v1';

        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
            if (!navigator.onLine) return;
            try {
              if (sessionStorage.getItem(TRIED)) return;
              sessionStorage.setItem(TRIED, '1');
            } catch (e) {
              return; // No storage means no way to stop a reload loop.
            }

            var done = function () {
              window.location.reload();
            };
            var caches_ = window.caches;
            Promise.resolve()
              .then(function () {
                return caches_
                  ? caches_.keys().then(function (keys) {
                      return Promise.all(
                        keys.map(function (k) {
                          return caches_.delete(k);
                        }),
                      );
                    })
                  : null;
              })
              .then(function () {
                return navigator.serviceWorker
                  ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                      return Promise.all(
                        regs.map(function (r) {
                          return r.unregister();
                        }),
                      );
                    })
                  : null;
              })
              .then(done, done);
          },
          true,
        );
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
